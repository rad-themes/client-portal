title: 'Portal module'
fields:
  -
    handle: title
    field:
      type: text
      display: Title
      validate:
        - required
  -
    handle: description
    field:
      type: textarea
      display: Description
  -
    handle: status
    field:
      type: button_group
      display: Status
      instructions: 'Inactive modules are visible but locked.'
      default: active
      options:
        active: Active
        inactive: Inactive
        complete: Complete
      width: 50
  -
    handle: due_date
    field:
      type: date
      display: 'Due date'
      instructions: 'Clients get a reminder email before this date.'
      width: 50
  -
    handle: client_can_complete
    field:
      type: toggle
      display: 'Client can mark complete'
      width: 50
  -
    handle: complete_label
    field:
      type: text
      display: 'Complete button label'
      placeholder: 'Mark as complete'
      width: 50
      if:
        client_can_complete: 'equals true'
  -
    handle: completed_at
    field:
      type: hidden
  -
    handle: completed_by
    field:
      type: hidden
