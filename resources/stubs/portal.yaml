title: Portal
tabs:
  main:
    display: Portal
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Title
              validate:
                - required
          -
            handle: project_status
            field:
              type: text
              display: 'Project status'
              instructions: 'Shown at the top of the portal, e.g. "In progress" or "Phase 2 Active".'
          -
            handle: welcome
            field:
              type: bard
              display: 'Welcome message'
              buttons: [h2, h3, bold, italic, unorderedlist, orderedlist, anchor]
          -
            handle: phases
            field:
              type: grid
              display: Phases
              mode: stacked
              add_row: 'Add phase'
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: 'Phase title'
                    validate:
                      - required
                -
                  handle: modules
                  field:
                    type: replicator
                    display: Modules
                    button_label: 'Add module'
                    sets:
                      modules:
                        display: Modules
                        sets:
                          link:
                            display: Link
                            icon: link
                            fields:
                              -
                                import: 'client-portal::module'
                              -
                                handle: url
                                field:
                                  type: link
                                  display: URL
                                  validate:
                                    - required
                              -
                                handle: button_label
                                field:
                                  type: text
                                  display: 'Button label'
                                  placeholder: Open
                          file:
                            display: 'File download'
                            icon: file-content-list
                            fields:
                              -
                                import: 'client-portal::module'
                              -
                                handle: files
                                field:
                                  type: assets
                                  display: Files
                                  container: assets
                                  validate:
                                    - required
                          content:
                            display: 'Content page'
                            icon: text-formatting-initial-letter
                            fields:
                              -
                                import: 'client-portal::module'
                              -
                                handle: body
                                field:
                                  type: bard
                                  display: Content
                                  container: assets
                                  buttons: [h2, h3, bold, italic, unorderedlist, orderedlist, quote, anchor, image, table]
                          embed:
                            display: 'Embed (Loom, Figma, Prototype)'
                            icon: video
                            fields:
                              -
                                import: 'client-portal::module'
                              -
                                handle: embed_url
                                field:
                                  type: text
                                  display: 'Embed or Shared URL'
                                  instructions: 'Paste Figma, Loom, YouTube, Google Doc, or Typeform link'
                              -
                                handle: embed_code
                                field:
                                  type: textarea
                                  display: 'Custom Iframe Code (Optional)'
                                  instructions: 'Or paste raw <iframe> embed snippet'
                          action:
                            display: 'Client Action / Approval'
                            icon: check-square
                            fields:
                              -
                                import: 'client-portal::module'
                              -
                                handle: action_label
                                field:
                                  type: text
                                  display: 'Action Button Label'
                                  placeholder: 'Approve Deliverable'
                              -
                                handle: action_required
                                field:
                                  type: toggle
                                  display: 'Action Required Badge'
                                  default: true
  branding:
    display: Branding & Settings
    sections:
      -
        fields:
          -
            handle: logo
            field:
              type: assets
              display: 'Client / Project Logo'
              max_files: 1
              container: assets
          -
            handle: brand_color
            field:
              type: color
              display: 'Brand Accent Color'
              default: '#4F46E5'
          -
            handle: access_type
            field:
              type: select
              display: 'Access Restriction'
              default: user_login
              options:
                user_login: 'Logged-in Clients Only'
                password: 'Password Protected'
                token: 'Direct Link Access Key'
                public: 'Public Access'
          -
            handle: access_password
            field:
              type: text
              display: 'Portal Password'
              instructions: 'Required if access type is set to Password Protected'
          -
            handle: access_token
            field:
              type: text
              display: 'Access Token / Secret Key'
              instructions: 'Secret query token (e.g. ?token=secret123)'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              validate:
                - required
          -
            handle: clients
            field:
              type: users
              display: Clients
              instructions: 'Users who can see this portal when logged in.'
              mode: select
