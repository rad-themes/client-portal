<label class="block">
    <span class="text-sm font-medium">{{ label | trans }}</span>
    <input type="{{ type ?? 'text' }}" name="{{ name }}" value="{{ value | sanitize }}" autocomplete="{{ autocomplete }}" required
        class="mt-1 w-full rounded-lg border border-zinc-300 px-3 py-2 focus:border-brand focus:ring-2 focus:ring-brand/20 focus:outline-none">
</label>
