<article class="flex flex-col rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm {{ status:value == 'inactive' ? 'opacity-60' : '' }}">
    <div class="flex items-start justify-between gap-3">
        <h3 class="font-medium">{{ title }}</h3>
        {{ if status:value == 'complete' }}
            <span class="shrink-0 rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-medium text-emerald-700">{{ trans key="Complete" }}</span>
        {{ elseif due_date }}
            <time datetime="{{ due_date format="Y-m-d" }}" class="shrink-0 text-xs text-zinc-500" title="{{ trans key="Due date" }}">
                {{ trans key="Due" }} {{ due_date format="M j" }}
            </time>
        {{ /if }}
    </div>

    {{ if description }}
        <p class="mt-2 text-sm text-zinc-600">{{ description }}</p>
    {{ /if }}

    {{ if status:value != 'inactive' }}
        <div class="mt-auto pt-4">{{ slot }}</div>
    {{ /if }}
</article>
