<!doctype html>
<html lang="{{ site:short_locale }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ title }} · {{ config:app:name }}</title>
    <link rel="stylesheet" href="/vendor/client-portal/portal.css">
</head>
<body class="min-h-screen bg-zinc-50 text-zinc-900 antialiased">
    {{ if logged_in }}
        <header class="border-b border-zinc-200 bg-white">
            <div class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-4 py-4">
                <a href="{{ route name="client-portal.index" }}" class="font-semibold tracking-tight">{{ config:app:name }}</a>
                <nav class="flex items-center gap-5 text-sm text-zinc-600">
                    <a href="{{ route name="client-portal.index" }}" class="hover:text-zinc-900">{{ trans key="All portals" }}</a>
                    <span class="hidden sm:inline">{{ current_user:name ?? current_user:email }}</span>
                    <a href="{{ user:logout_url redirect="/portal/login" }}" class="hover:text-zinc-900">{{ trans key="Log out" }}</a>
                </nav>
            </div>
        </header>
    {{ /if }}

    <main class="mx-auto max-w-5xl px-4 py-10">
        {{ template_content }}
    </main>
</body>
</html>
