{{ partial src="client-portal::card" }}
    {{ if embed_code }}
        <div class="aspect-video w-full overflow-hidden rounded-lg border border-zinc-200 bg-zinc-95">
            {!! embed_code !!}
        </div>
    {{ elseif embed_url }}
        <a href="{{ embed_url }}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 rounded-lg bg-zinc-900 px-4 py-2 text-sm font-medium text-white shadow hover:bg-zinc-800 transition">
            <span>{{ trans key="View Embedded Prototype / Media" }}</span>
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        </a>
    {{ /if }}
{{ /partial }}
