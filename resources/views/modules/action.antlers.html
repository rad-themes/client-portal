{{ partial src="client-portal::card" }}
    <div class="mt-2 flex items-center justify-between gap-3">
        {{ if status:value == 'complete' || status:value == 'approved' }}
            <div class="flex items-center gap-2 text-emerald-600 font-medium text-sm">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                <span>{{ trans key="Approved & Signed Off" }}</span>
            </div>
        {{ else }}
            <form action="{{ route name="client-portal.module.status" portal="{portal_slug}" module="{id}" }}" method="POST">
                {{ csrf_field }}
                <input type="hidden" name="status" value="complete">
                <button type="submit" class="inline-flex items-center gap-2 rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700 transition">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    <span>{{ action_label ?? 'Approve & Mark Complete' }}</span>
                </button>
            </form>
        {{ /if }}
    </div>
{{ /partial }}
