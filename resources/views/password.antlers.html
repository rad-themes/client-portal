<div class="mx-auto max-w-md py-12">
    <div class="rounded-2xl border border-zinc-200 bg-white p-8 shadow-sm text-center">
        <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-indigo-50 text-indigo-600 mb-4">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>

        <h1 class="text-2xl font-bold text-zinc-900">{{ title }}</h1>
        <p class="mt-2 text-sm text-zinc-600">{{ trans key="This portal is password protected. Enter the access password to continue." }}</p>

        {{ if error }}
            <div class="mt-4 rounded-lg bg-red-50 p-3 text-sm font-medium text-red-700">
                {{ error }}
            </div>
        {{ /if }}

        <form action="{{ route name="client-portal.verify-password" portal="{portal:slug}" }}" method="POST" class="mt-6 space-y-4">
            {{ csrf_field }}
            <div>
                <label for="password" class="sr-only">{{ trans key="Password" }}</label>
                <input type="password" name="password" id="password" required autofocus placeholder="{{ trans key="Enter portal password" }}"
                    class="w-full rounded-lg border border-zinc-300 px-4 py-2.5 text-sm focus:border-indigo-600 focus:outline-none focus:ring-1 focus:ring-indigo-600">
            </div>

            <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow hover:bg-indigo-700 transition">
                {{ trans key="Access Portal" }}
            </button>
        </form>
    </div>
</div>
